name: Build radargpt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOYMENT: dev:rugged-capybara-153
      VITE_CONVEX_URL: https://rugged-capybara-153.convex.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex types
        run: bunx convex codegen

      - name: Build
        run: bun run build
