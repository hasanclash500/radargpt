name: Build radargpt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_CONVEX_URL: https://rugged-capybara-153.convex.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bunx vite build

      - name: Run preview smoke test
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/radargpt-vite.log 2>&1 &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/radargpt-index.html; then
              grep -q '<div id="root"></div>' /tmp/radargpt-index.html
              kill $SERVER_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/radargpt-vite.log
          kill $SERVER_PID || true
          exit 1
