<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">نمای ساختمان مدرن دیوساز</title>
  <desc id="desc">تصویر برداری شده به سبک مینیمال از ساختمان مدرن با رنگ های سرمه ای و طلایی</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset=".52" stop-color="#d7e8f7"/>
      <stop offset="1" stop-color="#b8cee1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143b61"/>
      <stop offset="1" stop-color="#061b31"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9aa52"/>
      <stop offset=".5" stop-color="#f4d087"/>
      <stop offset="1" stop-color="#b6782c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ca47b"/>
      <stop offset="1" stop-color="#50684b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#00182e" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#sky)"/>
  <circle cx="1020" cy="135" r="72" fill="#ffffff" opacity=".55"/>
  <path d="M0 585 C190 545 320 570 485 548 C690 520 870 555 1200 500 L1200 760 L0 760 Z" fill="url(#ground)"/>

  <g opacity=".25" fill="#34506a">
    <path d="M0 470 L100 430 L150 470 Z"/>
    <path d="M90 470 L220 390 L330 470 Z"/>
    <path d="M920 450 L1035 360 L1160 455 Z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="162" y="316" width="440" height="282" rx="8" fill="#f5f1e8"/>
    <rect x="531" y="224" width="433" height="374" rx="8" fill="#e9e2d7"/>

    <rect x="198" y="354" width="148" height="188" rx="4" fill="url(#glass)"/>
    <rect x="370" y="354" width="190" height="188" rx="4" fill="url(#glass)"/>
    <rect x="572" y="272" width="164" height="270" rx="4" fill="url(#glass)"/>
    <rect x="764" y="272" width="158" height="270" rx="4" fill="url(#glass)"/>

    <g stroke="#d5ac67" stroke-width="10">
      <path d="M346 354 V542"/>
      <path d="M466 354 V542"/>
      <path d="M654 272 V542"/>
      <path d="M842 272 V542"/>
    </g>

    <rect x="144" y="302" width="476" height="24" rx="6" fill="#0b2d4b"/>
    <rect x="508" y="207" width="476" height="25" rx="6" fill="#0b2d4b"/>
    <rect x="143" y="576" width="856" height="30" rx="8" fill="url(#gold)"/>

    <rect x="950" y="404" width="102" height="194" rx="6" fill="#f3eee6"/>
    <rect x="971" y="440" width="60" height="158" rx="4" fill="#173d5c"/>
  </g>

  <g fill="#1b553f">
    <ellipse cx="110" cy="548" rx="58" ry="85"/>
    <ellipse cx="1052" cy="560" rx="62" ry="98"/>
    <ellipse cx="1135" cy="575" rx="48" ry="75"/>
  </g>
  <g fill="#41745b">
    <circle cx="94" cy="500" r="44"/>
