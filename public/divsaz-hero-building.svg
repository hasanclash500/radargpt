  <path d="M84 632 C365 612 670 618 1110 596" fill="none" stroke="#e7ddca" stroke-width="40" stroke-linecap="round"/>
  <path d="M84 632 C365 612 670 618 1110 596" fill="none" stroke="#c99b50" stroke-width="5" stroke-linecap="round" opacity=".7"/>
</svg>